    <dt>D</dt><dd>画笔：拿起或收起（也可以点圆球；圆球拖到哪边就贴在哪边，这台电脑记住；拿着笔时圆球是笔的颜色）。拿着笔时点击不翻页，方向键照常；收笔或翻页，笔迹就清掉</dd>
    <dt>1 2 3</dt><dd>拿着笔时换颜色：红、蓝、荧光笔（划代码行）</dd>
    <dt>C</dt><dd>擦掉笔迹，笔还拿着；白板开着时擦白板</dd>
    <dt>W</dt><dd>白板：在课件上面打开一张方格纸，自动拿起笔，只在纸上写；拖顶上的标题栏移动，拖右下角的折角改大小，这台电脑记住。后面的课件变暗、点不动，翻页键照常翻页，白板和写的东西都留着。再按 W、Esc 或 × 关掉，白板清掉</dd>
    <dt>Esc</dt><dd>关白板；没开白板就收笔</dd>
