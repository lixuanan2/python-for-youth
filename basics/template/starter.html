<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{title}} · 起始程序</title>
<!-- Generated by tools/build.py. Edit template/starter.html, not this file. -->
<style>
{{fonts}}
:root{
  --paper:#faf9f5;--sand:#f0eee6;--line:#dcd9ce;--ink:#141413;--night:#1f1e1d;--panel:#2a2927;
  --muted:#6b6a64;--clay:#c6613f;--clay-soft:#e8a58d;--amber:#e8b04b;--mint:#a9d4b0;
  --code:"JetBrains Mono",Consolas,Menlo,monospace;
  --text:"JetBrains Mono","Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
*{font-variant-ligatures:none!important}
body{background:var(--paper);color:var(--ink);font:400 18px/1.7 var(--text)}
a{color:inherit}
:focus-visible{outline:3px solid var(--clay);outline-offset:3px}

header{background:var(--night);color:var(--paper)}
.head-in,main,footer{max-width:1180px;margin:0 auto;padding-left:32px;padding-right:32px}
.head-in{padding-top:40px;padding-bottom:44px}
.crumbs{display:flex;flex-wrap:wrap;gap:8px 22px;font:400 16px var(--code)}
.crumbs a{color:#cfccc3;text-decoration:none}
.crumbs a:hover{color:var(--clay-soft);text-decoration:underline}
h1{margin-top:22px;font:800 clamp(34px,5vw,56px)/1.2 var(--text)}
h1::before{content:"# ";color:var(--clay)}
.lead{margin-top:14px;font-size:19px;color:#d9d6cc;max-width:42em}

main{padding-top:40px;padding-bottom:24px}
.files{list-style:none;border-top:4px solid var(--ink)}
.file{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 24px;align-items:center;padding:22px 0;border-bottom:1px solid var(--line)}
.file h2{font:700 22px/1.4 var(--code);overflow-wrap:anywhere}
.file h2 a{text-decoration:none}
.file h2 a:hover{color:var(--clay)}
.file p{color:var(--muted);font-size:16px}
.file nav{display:flex;flex-wrap:wrap;gap:10px}
.file nav a{font:700 16px var(--code);text-decoration:none;padding:9px 16px 10px;border-radius:9px;border:2px solid var(--ink)}
.file nav a:first-child{background:var(--ink);color:var(--paper)}
.file nav a:hover{background:var(--clay);border-color:var(--clay);color:#fff}
details{grid-column:1/-1}
summary{cursor:pointer;width:max-content;font:700 16px var(--code);color:var(--clay)}
details pre{margin-top:10px;background:var(--panel);color:#f4f2ec;border-radius:12px;padding:16px 20px;font:400 17px/1.7 var(--code);overflow-x:auto;tab-size:4}

footer{padding-top:24px;padding-bottom:56px;color:var(--muted);font-size:15px}
@media(max-width:860px){
  .head-in,main,footer{padding-left:20px;padding-right:20px}
  .file{grid-template-columns:minmax(0,1fr)}
}
</style>
</head>
<body>
<header><div class="head-in">
  <nav class="crumbs" aria-label="返回"><a href="../../index.html">← 课程首页</a><a href="../index.html">放映课件</a></nav>
  <h1>{{title}}：起始程序</h1>
  <p class="lead">共 {{count}} 个文件，按课件里出现的顺序排。点“在 {{ide}} 打开”，代码出现在网页上的 IDE 里，直接写、直接运行，需要联网。展开“看代码”能先读一遍，点“看第 … 页”回到课件里的那一页。点文件名或“下载”，可以把文件存到电脑上留着，没网时也能看。</p>
</div></header>

<main>
  <ol class="files">
{{files}}
  </ol>
</main>

<footer>{{footer}}</footer>
</body>
</html>
