<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{title}} · {{site}}</title>
<!-- Generated by tools/build.py. Edit lessons/ and template/, not this file. -->
<!-- Fixed-stage base from zarazhangrui/frontend-slides (MIT). JetBrains Mono embedded under SIL OFL 1.1. -->
<style>
{{css}}
:root{--file:"{{file}}"}
</style>
</head>
<body>
<div class="deck-viewport"><main class="deck-stage" id="deckStage" aria-label="{{title}}放映课件">
{{slides}}
</main></div>

<aside class="thumbs" id="thumbs" aria-label="页面缩略图"></aside>

<nav class="deck-controls" id="controls" aria-label="放映控制">
  <div class="track"><div class="segs" id="segs"></div><input id="slider" type="range" min="1" value="1" aria-label="拖动跳到某一页"><div class="bubble" id="bubble" hidden></div></div>
  <div class="row">
    <a href="../index.html" title="回到课程首页">首页</a>
    <button id="toggle-thumbs" type="button" title="页面缩略图（T）">缩略图</button>
    <button id="prev" type="button" aria-label="上一步">←</button>
    <input id="jump" type="number" min="1" aria-label="输入页码后按回车" title="输入页码后按回车（G）">
    <button id="next" type="button" aria-label="下一步">→</button>
    <span id="counter" role="status"></span>
    <div class="chips" id="chips"></div>
    <a class="go" id="ide-quick" target="_blank" rel="noopener noreferrer" title="带着这一页的代码打开 IDE（R）">▶ 打开 IDE</a>
    <button id="ide-open" type="button" title="IDE 设置（I）">IDE 设置</button>
    <button id="full" type="button" title="全屏（F）">全屏</button>
    <button id="help" type="button" title="快捷键（?）" aria-label="快捷键">?</button>
  </div>
</nav>

<div id="blank" hidden></div>

<dialog id="ide-settings" aria-labelledby="ide-title">
  <h2 id="ide-title">IDE 设置</h2>
  <div id="ide-fields"></div>
  <p>设置保存在这台电脑的浏览器里。IDE 是外部网站 <span id="ide-name"></span>，需要联网。</p>
  <button id="ide-close" type="button">完成</button>
</dialog>

<dialog id="help-panel" aria-labelledby="help-title">
  <h2 id="help-title">快捷键</h2>
  <dl>
    <dt>→ 或空格</dt><dd>下一步</dd>
    <dt>←</dt><dd>上一步</dd>
    <dt>T</dt><dd>显示或收起缩略图</dd>
    <dt>G</dt><dd>输入页码跳转</dd>
    <dt>R</dt><dd>带着本页代码打开 IDE</dd>
    <dt>I</dt><dd>IDE 设置</dd>
    <dt>F</dt><dd>全屏，全屏时动一下鼠标显示控制条</dd>
    <dt>B</dt><dd>黑屏，让学生看你，按任意键回来</dd>
    <dt>1–4</dt><dd>小测选答案</dd>
    <dt>P</dt><dd>算法演示：播放或暂停</dd>
    <dt>, 和 .</dt><dd>算法演示：上一步、下一步（键上印着 &lt; &gt;）</dd>
    <dt>0 和 S</dt><dd>算法演示：重来、换速度</dd>
  </dl>
  <button id="help-close" type="button">完成</button>
</dialog>

<script>
{{script}}
</script>
</body>
</html>
