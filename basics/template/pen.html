<!-- Pen and whiteboard: a small ball against a side of the stage (drag it to move it), shown when the mouse moves, like the control bar. -->
<div class="pen-ball" id="pen-ball">
  <div class="pen-tools" id="pen-tools" role="group" aria-label="画笔和白板">
    <button type="button" class="swatch" data-color="0" title="红笔（拿着笔时按 1）" aria-label="红笔"></button>
    <button type="button" class="swatch" data-color="1" title="蓝笔（拿着笔时按 2）" aria-label="蓝笔"></button>
    <button type="button" class="swatch" data-color="2" title="荧光笔：划代码行（拿着笔时按 3）" aria-label="荧光笔"></button>
    <button type="button" class="word" id="whiteboard" title="白板：在课件上面打开一块板写字（W），再按 W 或 Esc 关掉">白板</button>
    <button type="button" class="word" id="pen-off" title="收笔，笔迹清掉（Esc）">收笔</button>
  </div>
  <button type="button" class="ball" id="pen" title="画笔和白板（D 拿笔，W 白板）；拖动可以换位置" aria-label="画笔和白板" aria-expanded="false">✎</button>
</div>
