<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<!-- The site's home page, written by basics/tools/promo.py from home/content.json and home/page.html: change the text in
     content.json, the frame here, then run python3 tools/build.py in basics/. The workflow copies the fonts into fonts/. -->
<style>
@font-face{font-family:"JetBrains Mono";font-weight:400;font-style:normal;src:url(fonts/jetbrains-mono-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"JetBrains Mono";font-weight:700;font-style:normal;src:url(fonts/jetbrains-mono-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"JetBrains Mono";font-weight:800;font-style:normal;src:url(fonts/jetbrains-mono-latin-800-normal.woff2) format("woff2")}
:root{
  --paper:#faf9f5;--sand:#f0eee6;--line:#dcd9ce;--ink:#141413;--night:#1f1e1d;--panel:#2a2927;
  --muted:#6b6a64;--clay:#c6613f;--clay-soft:#e8a58d;--amber:#e8b04b;--olive:#5b6f45;--mint:#a9d4b0;
  --code:"JetBrains Mono",Consolas,Menlo,monospace;
  --text:"JetBrains Mono","Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
*{font-variant-ligatures:none!important}
body{background:var(--paper);color:var(--ink);font:400 18px/1.7 var(--text)}
a{color:inherit}
:focus-visible{outline:3px solid var(--clay);outline-offset:3px}
code{font:400 .92em var(--code);background:var(--sand);padding:1px 6px;border-radius:5px}
kbd{font:700 .85em var(--code);border:2px solid #b9b5a8;border-bottom-width:4px;border-radius:6px;padding:0 6px;background:#fff}

/* === HERO === */
.hero{background:var(--night);color:var(--paper)}
.hero-in{max-width:1180px;margin:0 auto;padding:72px 32px 76px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:64px;align-items:center}
h1{font:800 clamp(42px,6vw,76px)/1.14 var(--text);letter-spacing:-1px}
.en{margin-top:22px;font:400 15px/1.65 var(--code);color:#a8a59b;max-width:38em}
.lead{margin-top:18px;font-size:21px;color:#d9d6cc;max-width:30em}
.actions{margin-top:32px;display:flex;flex-wrap:wrap;gap:14px 18px;align-items:center}
.start{display:inline-block;background:var(--mint);color:#16261a;font:700 21px var(--code);text-decoration:none;padding:14px 28px 16px;border-radius:12px;box-shadow:0 6px 0 #5f8f6a}
.start.project{background:var(--amber);color:#2a1d05;box-shadow:0 6px 0 #b98a35}
.start.project:active{box-shadow:0 2px 0 #b98a35}
.start:hover{filter:brightness(1.06)}.start:active{transform:translateY(4px);box-shadow:0 2px 0 #5f8f6a}
.more{margin-top:22px;font-size:18px;color:#d9d6cc}
.more a{color:var(--amber)}
.editor{background:var(--panel);border-radius:14px;overflow:hidden;box-shadow:0 24px 50px #0006}
.tab{padding:10px 22px;font:400 15px var(--code);color:#cfccc3;background:#232220;border-bottom:3px solid var(--clay)}
.editor pre{font:400 clamp(17px,2vw,24px)/1.8 var(--code);padding:20px 24px;color:#f4f2ec;overflow-x:auto}
.g{display:inline-block;width:2em;color:#77746b}.f{color:var(--clay-soft)}.s{color:var(--mint)}
.run{background:#191817;padding:18px 24px 22px;border-top:1px solid #3a3936}
.run label{display:block;font-size:15px;color:#a8a59b;margin-bottom:6px}
.run input{width:100%;background:none;border:0;border-bottom:3px solid var(--amber);color:#fff;font:700 clamp(20px,2.4vw,28px) var(--code);padding:4px 0;outline:none}
.say{margin-top:14px;font:700 clamp(20px,2.4vw,28px)/1.4 var(--code);color:var(--amber);min-height:1.4em;overflow-wrap:anywhere}

/* === SECTIONS === */
main{max-width:1180px;margin:0 auto;padding:20px 32px 40px}
section{padding:52px 0 8px}
h2{font:800 36px/1.3 var(--text)}
h2::before{content:"# ";color:var(--clay)}
.intro{margin-top:8px;color:var(--muted)}
.grid{margin-top:26px;display:grid;gap:18px;grid-template-columns:repeat(3,minmax(0,1fr))}
.card{background:var(--sand);border-top:6px solid var(--ink);padding:22px 24px 24px}
.card h3{font:800 22px/1.4 var(--text)}
.card p{margin-top:8px;color:#3d3c38;font-size:17px}
.who .card:nth-child(1){border-color:var(--clay)}.who .card:nth-child(2){border-color:var(--amber)}.who .card:nth-child(3){border-color:var(--olive)}
.features{margin-top:26px;list-style:none;border-top:4px solid var(--ink)}
.features li{display:grid;grid-template-columns:300px minmax(0,1fr);gap:24px;padding:20px 0;border-bottom:1px solid var(--line)}
.features b{font:800 21px/1.5 var(--text)}
.features b::before{content:"▸ ";color:var(--clay)}
.features span{color:#3d3c38}
.slot{display:inline-block;min-width:2.6em;text-align:center;background:#fff3c4;border:2px solid var(--amber);border-radius:6px;font:700 .9em var(--code);padding:0 6px}
.use{grid-template-columns:repeat(2,minmax(0,1fr))}
.use .card{border-color:var(--clay)}
.use .card:nth-child(2){border-color:var(--amber)}
.keys{margin-top:18px;color:var(--muted);font-size:16px}

/* === MODULES === */
.module{margin-top:26px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px 24px;align-items:center;background:var(--sand);border-left:8px solid var(--clay);padding:22px 26px}
.module h3{font:800 28px/1.3 var(--text)}
.module h3 small{font:700 15px var(--code);color:#fff;background:var(--olive);padding:3px 10px 4px;border-radius:7px;margin-left:12px;vertical-align:middle}
.module p{color:var(--muted);font-size:16px;margin-top:4px}
.module nav{display:flex;flex-wrap:wrap;gap:10px}
.module a,.talk a{font:700 16px var(--code);text-decoration:none;padding:9px 16px 10px;border-radius:9px;border:2px solid var(--ink)}
.module a:first-child,.talk a{background:var(--ink);color:var(--paper)}
.module a:hover,.talk a:hover{background:var(--clay);border-color:var(--clay);color:#fff}
.stages{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px}
.stages span{font-size:15px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:2px 12px}
.later{margin-top:14px;color:var(--muted)}
.demo{grid-column:1/-1;margin:6px 0 0}
.demo video{display:block;width:100%;height:auto;aspect-ratio:16/9;border-radius:10px;background:var(--ink)}
.demo p{margin-top:8px}

/* === NOTES === */
.edge{margin-top:22px;background:#fdf3dc;border-left:8px solid var(--amber);padding:20px 26px}
.talk{margin-top:22px;background:var(--night);color:var(--paper);padding:30px 32px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px 28px;align-items:center}
.talk p{color:#d9d6cc}
.talk p a{all:unset;color:var(--amber);text-decoration:underline;cursor:pointer}
.talk a{background:var(--mint);color:#16261a;border-color:var(--mint)}

footer{max-width:1180px;margin:0 auto;padding:30px 32px 56px;color:var(--muted);font-size:15px}
footer a{color:var(--ink)}
@media(max-width:860px){
  .hero-in{grid-template-columns:minmax(0,1fr);gap:40px;padding:48px 20px 56px}
  main{padding:8px 20px 24px}footer{padding:24px 20px 44px}
  section{padding-top:40px}
  .grid,.use{grid-template-columns:minmax(0,1fr)}
  .features li{grid-template-columns:minmax(0,1fr);gap:4px}
  .module,.talk{grid-template-columns:minmax(0,1fr)}
}
</style>
</head>
<body>
<header class="hero"><div class="hero-in">
  <div>
    <h1>{{title_html}}</h1>
    <p class="en" lang="en">{{en}}</p>
    <p class="lead">{{lead}}</p>
    <div class="actions">
{{actions}}
    </div>
    <p class="more">{{more}}</p>
  </div>
  <div class="editor">
    <div class="tab">hello.py</div>
    <pre><span class="g">1</span>name = <span class="f">input</span>()
<span class="g">2</span><span class="f">print</span>(<span class="s">"你好"</span>, name)</pre>
    <div class="run">
      <label for="name">程序在等你打字，写下你的名字</label>
      <input id="name" value="小明" maxlength="16" autocomplete="off">
      <p class="say" id="say" role="status">你好 小明</p>
    </div>
  </div>
</div></header>

<main>
{{main}}
</main>

<footer>{{footer}}</footer>

<script>
const input = document.getElementById('name'), say = document.getElementById('say');
input.oninput = () => { say.textContent = '你好 ' + input.value; };
</script>
</body>
</html>
