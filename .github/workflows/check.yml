# Check every module, then publish the site from main only when every check has passed.
name: check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: basics
        working-directory: basics
        run: python tools/check.py

  # Every page in real Chrome: layout, quizzes, yellow boxes run against real Python, IDE links.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Chinese fonts and the Chrome sandbox
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq fonts-noto-cjk
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: basics
        working-directory: basics
        run: node tools/check_browser.mjs
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-screenshots
          path: basics/.preview
          include-hidden-files: true

  deploy:
    needs: [check, browser]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      # The course IDE: pinned JupyterLite with Pyodide inside, so students' browsers load nothing from a CDN.
      - uses: actions/cache@v4
        with:
          path: ide/.cache
          key: ide-${{ hashFiles('ide/prepare.py') }}
      - name: Build the IDE
        working-directory: ide
        run: |
          python -m pip install -q -r requirements.txt
          python prepare.py
          jupyter lite build
      # The home page sits at the top; each module's dist/ goes under its own folder name, the IDE under ide/.
      - name: Assemble the site
        run: |
          mkdir -p _site/fonts
          cp home/index.html _site/
          cp basics/vendor/fonts/*.woff2 basics/vendor/fonts/JetBrainsMono-OFL.txt _site/fonts/
          cp -R basics/dist _site/basics
          cp -R ide/_output _site/ide
          du -sh _site _site/ide
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
