# Check every module, then publish the site from main only when every check has passed.
# check.py and the project checks run every time. Chrome checks only what the change can affect (see .github/browser_plan.py):
# nothing for README or home page edits, the changed lessons or projects, or everything split over four runners. The weekly
# run and a manual run check everything.
name: check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: basics
        working-directory: basics
        run: python tools/check.py

  # The project module: dist/ current and without answers, then every stage the way a student meets it: the starter's
  # tests fail cleanly, the answers pass, the front end plays. On Windows too, where students run it, with the
  # console's own encoding: the student programs get no UTF-8 help from here.
  project:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.14'}
          - {os: windows-latest, python: '3.12'}
          - {os: windows-latest, python: '3.14'}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # The window front end (play_window.py) checks itself with tkinter, which needs a screen: Linux gets a virtual one.
      - name: project
        if: runner.os != 'Linux'
        working-directory: project
        run: |
          python tools/check.py
          python tools/verify.py
      - name: project, with a virtual screen
        if: runner.os == 'Linux'
        working-directory: project
        run: |
          command -v xvfb-run || (sudo apt-get update -q && sudo apt-get install -yq xvfb)
          python tools/check.py
          xvfb-run -a python tools/verify.py

  # What the browser job checks, from the files this push or pull request changed.
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          BASE: ${{ github.event_name == 'push' && github.event.before || github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        run: |
          if [ -n "$BASE" ]; then git fetch -q --depth=1 origin "$BASE" || true; fi
          matrix=$(python3 .github/browser_plan.py "$BASE")
          echo "$matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  # Pages in real Chrome: layout, quizzes, yellow boxes run against real Python, IDE links. With nothing to check the job
  # still succeeds, so deploy runs.
  browser:
    needs: plan
    name: browser (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    env:
      BASICS: ${{ matrix.basics }}
      SHARD: ${{ matrix.shard }}
      PROJECTS: ${{ matrix.project }}
      WORK: ${{ matrix.basics != '' || matrix.project != '' }}
    steps:
      - if: env.WORK != 'true'
        run: echo "No page can look different after this change, so there is nothing to open in Chrome."
      - if: env.WORK == 'true'
        uses: actions/checkout@v4
      - if: env.WORK == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - if: env.WORK == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Chinese fonts and the Chrome sandbox
        if: env.WORK == 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq fonts-noto-cjk
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: basics
        if: env.BASICS != ''
        working-directory: basics
        run: |
          if [ "$BASICS" = all ]; then node tools/check_browser.mjs --shard "$SHARD"; else node tools/check_browser.mjs $BASICS; fi
      - name: project
        if: env.PROJECTS != ''
        working-directory: project
        run: |
          if [ "$PROJECTS" = all ]; then node tools/check_browser.mjs; else node tools/check_browser.mjs $PROJECTS; fi
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-screenshots-${{ strategy.job-index }}
          path: |
            basics/.preview
            project/.preview
          include-hidden-files: true

  deploy:
    needs: [check, project, browser]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      # The course IDE: pinned JupyterLite with Pyodide inside, so students' browsers load nothing from a CDN.
      - uses: actions/cache@v4
        with:
          path: ide/.cache
          key: ide-${{ hashFiles('ide/prepare.py') }}
      - name: Build the IDE
        working-directory: ide
        run: |
          python -m pip install -q -r requirements.txt
          python prepare.py
          jupyter lite build
      # The home page sits at the top; each module's dist/ goes under its own folder name, the IDE under ide/.
      - name: Assemble the site
        run: |
          mkdir -p _site/fonts
          cp home/index.html _site/
          cp basics/vendor/fonts/*.woff2 basics/vendor/fonts/JetBrainsMono-OFL.txt _site/fonts/
          cp -R basics/dist _site/basics
          cp -R project/dist _site/project
          cp -R ide/_output _site/ide
          du -sh _site _site/ide
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
