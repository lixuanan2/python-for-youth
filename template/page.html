<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{title}} · Python课堂</title>
<!-- Generated by tools/build.py. Edit lessons/ and template/, not this file. -->
<!-- Fixed-stage base from zarazhangrui/frontend-slides (MIT). JetBrains Mono embedded under SIL OFL 1.1. -->
<style>
{{css}}
:root{--file:"{{file}}"}
</style>
</head>
<body>
<div class="deck-viewport"><main class="deck-stage" id="deckStage" aria-label="{{title}}放映课件">
{{slides}}
</main></div>

<nav class="deck-controls" id="controls" aria-label="放映控制"><button id="prev" type="button">←</button><span id="counter" role="status"></span><button id="next" type="button">→</button><button id="full" type="button">全屏 F</button><button id="ide-open" type="button">IDE 设置 I</button></nav>

<dialog id="ide-settings" aria-labelledby="ide-title">
  <h2 id="ide-title">IDE 设置</h2>
  <label>主题<select id="ide-theme"><option value="JupyterLab Dark">深色</option><option value="JupyterLab Light">浅色</option></select></label>
  <label>布局<select id="ide-layout"><option value="left">代码在左，结果在右</option><option value="top">代码在上，结果在下</option></select></label>
  <label>打开后自动运行<select id="ide-run"><option value="0">不运行，学生自己点</option><option value="1">立刻运行</option></select></label>
  <p>设置保存在这台电脑的浏览器里。IDE 是外部网站 JupyterLite，需要联网。</p>
  <button id="ide-close" type="button">完成</button>
</dialog>

<script>
{{script}}
</script>
</body>
</html>
