<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{site}}</title>
<!-- Generated by tools/build.py. Edit template/index.html, not this file. -->
<style>
{{fonts}}
:root{
  --paper:#faf9f5;--sand:#f0eee6;--line:#dcd9ce;--ink:#141413;--night:#1f1e1d;--panel:#2a2927;
  --muted:#6b6a64;--clay:#c6613f;--clay-soft:#e8a58d;--amber:#e8b04b;--olive:#5b6f45;--mint:#a9d4b0;
  --code:"JetBrains Mono",Consolas,Menlo,monospace;
  --text:"JetBrains Mono","Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font:400 18px/1.7 var(--text);font-variant-ligatures:none}
a{color:inherit}
:focus-visible{outline:3px solid var(--clay);outline-offset:3px}

/* === HERO: the first lesson, running on the page === */
.hero{background:var(--night);color:var(--paper)}
.hero-in{max-width:1180px;margin:0 auto;padding:72px 32px 76px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:64px;align-items:center}
h1{font:800 clamp(42px,6vw,76px)/1.14 var(--text);letter-spacing:-1px}
.lead{margin-top:24px;font-size:21px;color:#d9d6cc;max-width:30em}
.start{display:inline-block;margin-top:34px;background:var(--mint);color:#16261a;font:700 21px var(--code);text-decoration:none;padding:14px 28px 16px;border-radius:12px;box-shadow:0 6px 0 #5f8f6a}
.start:hover{filter:brightness(1.06)}.start:active{transform:translateY(4px);box-shadow:0 2px 0 #5f8f6a}
.editor{background:var(--panel);border-radius:14px;overflow:hidden;box-shadow:0 24px 50px #0006}
.tab{padding:10px 22px;font:400 15px var(--code);color:#cfccc3;background:#232220;border-bottom:3px solid var(--clay)}
.editor pre{font:400 clamp(17px,2vw,24px)/1.8 var(--code);padding:20px 24px;color:#f4f2ec;overflow-x:auto}
.g{display:inline-block;width:2em;color:#77746b}.f{color:var(--clay-soft)}.s{color:var(--mint)}
.run{background:#191817;padding:18px 24px 22px;border-top:1px solid #3a3936}
.run label{display:block;font-size:15px;color:#a8a59b;margin-bottom:6px}
.run input{width:100%;background:none;border:0;border-bottom:3px solid var(--amber);color:#fff;font:700 clamp(20px,2.4vw,28px) var(--code);padding:4px 0;outline:none}
.say{margin-top:14px;font:700 clamp(20px,2.4vw,28px)/1.4 var(--code);color:var(--amber);min-height:1.4em;overflow-wrap:anywhere}

/* === ROUTE: the course as one line with stops === */
main{max-width:1180px;margin:0 auto;padding:68px 32px 40px}
h2{font:800 36px/1.3 var(--text)}
h2::before{content:"# ";color:var(--clay)}
.intro{margin-top:8px;color:var(--muted)}
.stage{display:grid;grid-template-columns:150px minmax(0,1fr);gap:24px;padding:26px 0;border-bottom:1px solid var(--line)}
.stage:first-of-type{margin-top:26px;border-top:4px solid var(--ink)}
.stage h3{font:700 22px/1.5 var(--text);padding-top:6px}
.stops{list-style:none;display:flex;flex-wrap:wrap;gap:12px 0;position:relative}
.stop{display:flex;align-items:center;font-size:17px;color:var(--muted);padding:6px 26px 6px 0}
.stop::before{content:attr(data-n);flex:none;width:36px;height:36px;margin-right:10px;border:2px solid #b9b5a8;border-radius:50%;font:400 14px/32px var(--code);text-align:center}

/* === THE LESSON THAT IS READY === */
.ready{margin-top:18px;width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px 24px;align-items:center;background:var(--sand);border-left:8px solid var(--clay);padding:22px 26px}
.ready h4{font:800 28px/1.3 var(--text)}
.ready p{color:var(--muted);font-size:16px}
.ready nav{display:flex;flex-wrap:wrap;gap:10px}
.ready a{font:700 16px var(--code);text-decoration:none;padding:9px 16px 10px;border-radius:9px;border:2px solid var(--ink)}
.ready a:first-child{background:var(--ink);color:var(--paper)}
.ready a:hover{background:var(--clay);border-color:var(--clay);color:#fff}

footer{max-width:1180px;margin:0 auto;padding:30px 32px 56px;color:var(--muted);font-size:15px}
@media(max-width:860px){
  .hero-in{grid-template-columns:minmax(0,1fr);gap:40px;padding:48px 20px 56px}
  main{padding:48px 20px 24px}footer{padding:24px 20px 44px}
  .stage{grid-template-columns:minmax(0,1fr);gap:10px}
  .ready{grid-template-columns:minmax(0,1fr)}
}
</style>
</head>
<body>
<header class="hero"><div class="hero-in">
  <div>
    <h1>{{heading}}</h1>
    <p class="lead">{{lead}}</p>
    <a class="start" href="{{first}}/index.html">{{start}}</a>
  </div>
  <div class="editor">
    <div class="tab">{{hero_file}}</div>
    <pre>{{hero_code}}</pre>
    <div class="run">
      <label for="name">{{hero_prompt}}</label>
      <input id="name" value="{{hero_sample}}" maxlength="16" autocomplete="off">
      <p class="say" id="say" role="status">{{hero_reply}}{{hero_sample}}</p>
    </div>
  </div>
</div></header>

<main>
  <h2>学习路线</h2>
  <p class="intro">一共 {{total}} 节课，新版已完成 {{ready}} 节，其余还在规划中。</p>
{{route}}
</main>

<footer>{{footer}}</footer>

<script>
const input = document.getElementById('name'), say = document.getElementById('say');
input.oninput = () => { say.textContent = '{{hero_reply}}' + input.value; };
</script>
</body>
</html>
